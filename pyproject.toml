[project]
name="pan-os-policy-agent"
version="0.0.1"
requires-python = ">=3.11,<3.12"
description="AI agent that validates hypotetical security policy against the current policy set on the NGFW"

dependencies = [
    "pan-os-mcp",
    "pan-os-rag",
    "pan-os-agent",
]
[tool.uv.workspace]
members=["packages/*"]

[tool.ruff]
line-length=100

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Collect only real test modules; scripts like smoke_test.py would otherwise
# match the default *_test.py glob and collide across packages.
python_files = ["test_*.py"]
testpaths = ["packages"]

[tool.uv]
package=false

[tool.uv.sources]
pan-os-mcp = { workspace = true }
pan-os-rag = { workspace = true }
pan-os-agent = { workspace = true }

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio",
    "mypy",
]
# Demo-only: the Streamlit UI. Kept out of pan-os-agent's deps so the library
# doesn't depend on a GUI framework. Install on demand with `uv run --group demo`.
demo = [
    "streamlit",
]

